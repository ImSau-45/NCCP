name: HiFi CI — NCCP
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '>=18.0.0'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Build
      run: npm run build
    - name: Build Docker image
      run: docker build -t nccp .
    - name: Deploy
      if: github.ref == 'refs/heads/main'
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: echo 'Add your deploy command here'
    - name: Notify HiFi on failure
      if: failure()
      env:
        HIFI_URL: ${{ secrets.HIFI_URL }}
        HIFI_API_KEY: ${{ secrets.HIFI_API_KEY }}
      run: 'if [ -z "$HIFI_URL" ] || [ -z "$HIFI_API_KEY" ]; then echo "HIFI_URL /
        HIFI_API_KEY secrets not set; skipping auto-fix notify"; exit 0; fi

        curl -sS -X POST "$HIFI_URL/api/autofix/receive-failure" -H "Content-Type:
        application/json" -H "X-Hifi-Key: $HIFI_API_KEY" -d "{"repo":"${{ github.repository
        }}","branch":"${{ github.ref_name }}","commit":"${{ github.sha }}"}" || true'
